[package]
name = "omnilook-core"
description = "Omni Look's previewers: file type detection and the preview of each type, platform independent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ammonia = "4.2.4"
chardetng = "1.0.0"
encoding_rs = "0.8.44"
image = { version = "0.25.10", default-features = false, features = ["png", "tiff"] }
lofty = "0.25.5"
omnizip-formats = { git = "https://github.com/VoidDel/OmniZip", rev = "017ca0d287f54047a84d657f5ba3ee2827ab10f8", version = "0.1.0" }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
roxmltree = "0.21"
serde.workspace = true
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
