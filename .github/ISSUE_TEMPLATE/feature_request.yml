name: 功能建议
description: 希望支持的文件类型、希望增加或改进的功能
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 现在哪里不方便，或者哪种文件预览不了
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望它怎么工作
  - type: textarea
    id: other
    attributes:
      label: 其他
      description: 别的软件（macOS Quick Look、QuickLook、PowerToys Peek、Seer 等）里类似的功能、截图等
