# Tagged releases: pushing a tag `v<version>` (the version in tauri.conf.json) builds the
# installers into one draft release:
#
#   Windows  NSIS (per user)          Linux  .deb, .rpm, AppImage (the command-line mode, §7)
#
# with each update package signed with Omni Look's minisign key (secret
# TAURI_SIGNING_PRIVATE_KEY, and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if it has one) and latest.json
# for the in-app updater. Publishing the draft makes it the update. Code signing is not part of
# this yet (docs/development-plan.md §10, M3).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the app's version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but tauri.conf.json has version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: .github/scripts/linux-deps.sh patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Omni Look ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md and the assets below for Windows and Linux.
          releaseDraft: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
