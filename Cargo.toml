[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "spikes/m0-viewer"]
# The M0 spike stays buildable but out of everyday builds and tests.
default-members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Omni Look Contributors"]
repository = "https://github.com/VoidDel/OmniLook"
publish = false

[workspace.dependencies]
omnilook-core = { path = "crates/omnilook-core" }
omnilook-win = { path = "crates/omnilook-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-build = "2"
windows = "0.62"
windows-core = "0.62"
