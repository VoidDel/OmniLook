[package]
name = "omnilook-desktop"
description = "Omni Look: the resident hotkey agent, the preview window and the settings window (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "omnilook_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "omnilook"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[features]
# Serves the built frontend (dist) from the binary instead of the dev server; `tauri build` turns
# it on, so does a plain `cargo build --features custom-protocol` for testing.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
omnilook-core.workspace = true
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
omnilook-win.workspace = true
windows-core.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
